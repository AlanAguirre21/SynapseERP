<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Código de recuperación — SynapseERP</title>
  </head>
  <body style="margin:0; padding:0; background-color:#fbf8f6; font-family:Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fbf8f6; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#ffffff; border-radius:16px; overflow:hidden;">
            <tr>
              <td align="center" style="padding:32px 32px 8px 32px;">
                <img src="cid:logo_synapse" alt="SynapseERP" width="180" style="display:block; max-width:180px; height:auto; border:0;" />
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 0 32px; text-align:center;">
                <h1 style="margin:0; font-size:20px; line-height:1.3; color:#241f26; font-weight:600;">Código de recuperación</h1>
                <p style="margin:8px 0 0 0; font-size:14px; line-height:1.5; color:#6b6470;">
                  Usa este código para continuar con el restablecimiento de tu contraseña.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="padding:14px 28px; background-color:#f3dce6; border-radius:12px;">
                      <span style="font-size:32px; letter-spacing:8px; font-weight:700; color:#a6295f; font-family:Arial, Helvetica, sans-serif;">{{ codigo }}</span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 32px 32px; text-align:center;">
                <p style="margin:0; font-size:13px; line-height:1.5; color:#6b6470;">
                  Vence en {{ vigencia_minutos }} minutos. Si no solicitaste este código, ignora este correo.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px; background-color:#fbf8f6; text-align:center; border-top:1px solid #ebe2e6;">
                <p style="margin:0; font-size:12px; color:#9b93a0;">SynapseERP</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
